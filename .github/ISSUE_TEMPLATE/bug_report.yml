name: Bug report
description: Report a reproducible defect in NoCodeComments.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues before submitting a new report.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal code sample and steps
      description: Include the language, a small input sample and the steps needed to reproduce the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: notes
    attributes:
      label: Additional context
